<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#ffb066" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ff8c42" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff8c42" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#f8e3a8"/>
      <stop offset="30%" stop-color="#e7b654"/>
      <stop offset="65%" stop-color="#a9762c"/>
      <stop offset="100%" stop-color="#6e4a1a"/>
    </linearGradient>
    <radialGradient id="face" cx="40%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#1f6b4f"/>
      <stop offset="60%" stop-color="#0f3d2e"/>
      <stop offset="100%" stop-color="#071f16"/>
    </radialGradient>
    <clipPath id="faceClip"><circle cx="256" cy="256" r="204"/></clipPath>
  </defs>

  <!-- glow de fundo -->
  <circle cx="256" cy="234" r="256" fill="url(#glow)"/>

  <!-- moldura metalica -->
  <circle cx="256" cy="256" r="238" fill="url(#ring)"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#4a3011" stroke-width="3" stroke-opacity="0.6"/>

  <g clip-path="url(#faceClip)">
    <circle cx="256" cy="256" r="204" fill="url(#face)"/>

    <!-- carta de tras -->
    <g transform="translate(212,302) rotate(-16)">
      <rect x="-56" y="-82" width="112" height="160" rx="16" fill="#e9dcc0" stroke="#241509" stroke-width="4"/>
      <text x="0" y="20" font-size="66" text-anchor="middle" fill="#211a14">♣</text>
    </g>

    <!-- carta da frente -->
    <g transform="translate(300,258) rotate(9)">
      <rect x="-58" y="-84" width="116" height="164" rx="16" fill="#fdf8ec" stroke="#241509" stroke-width="4"/>
      <text x="0" y="22" font-size="70" text-anchor="middle" fill="#a8352a">♥</text>
    </g>

    <!-- brilho -->
    <ellipse cx="230" cy="150" rx="190" ry="90" fill="#ffffff" opacity="0.14"/>
  </g>

  <circle cx="256" cy="256" r="238" fill="none" stroke="#fff3d6" stroke-opacity="0.35" stroke-width="4"/>
</svg>
